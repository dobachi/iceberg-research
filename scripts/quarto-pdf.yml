# PDF（一冊もの）を組むための Quarto プロジェクト設定。
#
# サイト本体は website 型で、website は複数ページを1つの PDF にまとめられない。
# そこで scripts/build-pdf.sh が本文を .pdf-build/ にコピーし、このファイルを
# .pdf-build/_quarto.yml として置いて book 型でレンダリングする。
# 章立ては _quarto.yml のサイドバーと同じ順序に揃えること。
project:
  type: book
  output-dir: _pdf

book:
  title: "Apache Iceberg 調査報告書"
  subtitle: "Apache Iceberg と Iceberg REST Catalog について、一次情報の裏取りを前提にまとめた技術調査"
  author: "dobachi"
  # 版（報告書を発行した日）。調査基準日 2026-07-17 とは別物。
  # date / output-file / フッタの3箇所に版が入る。VERSION が正なので、
  # 直接書き換えず scripts/set-version.sh で反映すること。
  date: "2026-07-21"
  output-file: "iceberg-research-2026-07-21"

  chapters:
    - index.qmd
    - docs/01-architecture.qmd
    - docs/02-table-spec.qmd
    - docs/03-rest-catalog.qmd
    - docs/04-catalog-implementations.qmd
    - docs/05-engine-support.qmd
    - docs/06-operations.qmd
    - docs/07-ecosystem.qmd
    - docs/08-decision-guide.qmd

  appendices:
    - docs/90-glossary.qmd
    - docs/99-methodology.qmd
    - fact-check-report.qmd

# 日本語は lualatex + luatexja で組む。フォントは Noto CJK に固定してあるので、
# CI 側で fonts-noto-cjk を入れておくこと（.github/workflows/publish.yml）。
format:
  pdf:
    documentclass: scrreprt
    classoption: [11pt]
    pdf-engine: lualatex
    lang: ja
    mainfont: "Noto Serif CJK JP"
    sansfont: "Noto Sans CJK JP"
    monofont: "Noto Sans Mono CJK JP"
    CJKmainfont: "Noto Serif CJK JP"
    CJKsansfont: "Noto Sans CJK JP"
    CJKmonofont: "Noto Sans Mono CJK JP"
    CJKoptions:
      - BoldFont=Noto Sans CJK JP Bold
    geometry:
      - top=25mm
      - bottom=25mm
      - left=22mm
      - right=22mm
    toc: true
    toc-depth: 3
    toc-title: 目次
    number-sections: true
    colorlinks: true
    code-overflow: wrap
    fig-align: center
    fig-pos: "htbp"
    include-in-header:
      text: |
        % 図が本文幅・ページ高さを超えないよう、全ての画像に上限を付ける。
        % Quarto は mermaid 図に実寸（例 width=11.81in）を指定してくるので、
        % \setkeys{Gin} の既定値では効かず、\includegraphics 自体を包む必要がある。
        \usepackage[export]{adjustbox}
        \let\origincludegraphics\includegraphics
        \renewcommand{\includegraphics}[2][]{%
          \origincludegraphics[#1,max width=\linewidth,max totalheight=0.85\textheight,keepaspectratio]{#2}}

        % 紙に刷ったり切り出したりしても版が分かるよう、全ページのフッタに版を出す。
        % scrreprt は KOMA なので fancyhdr ではなく scrlayer-scrpage を使う。
        % 星付き（\cfoot* など）は plain（章扉）にも同時に効く。
        \usepackage{scrlayer-scrpage}
        \clearpairofpagestyles
        \cfoot*{\pagemark}
        \ofoot*{\footnotesize Version 2026-07-21}
