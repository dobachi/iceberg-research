name: Publish to GitHub Pages

# サイト（HTML）を組んだあと、同じ内容を1冊にまとめた PDF を _site/ に同梱して公開する。
# PDF は lualatex + luatexja で組むので TeX（TinyTeX）と日本語フォント（Noto CJK）が要り、
# 本文中の mermaid 図を画像に落とすのに Chrome を使う。

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    # mermaid の描画で Chrome が返らずハングしたことがあるため上限を切る
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      # scripts/quarto-pdf.yml で Noto CJK を名指ししているため、無いと PDF の日本語が消える
      - name: Install Japanese fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends fonts-noto-cjk
          fc-cache -f

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2
        with:
          tinytex: true

      # 足りないパッケージは Quarto が描画中に自動で入れるが、
      # 主要なものを先に入れて再試行の回数を減らす（名前違いは無視して先へ進む）
      - name: Install LaTeX packages
        run: |
          tlmgr update --self || true
          for pkg in luatexja adjustbox koma-script fontspec unicode-math geometry \
                     caption float booktabs framed fancyvrb microtype parskip xurl \
                     bookmark footnotehyper mdwtools subcaption tcolorbox environ \
                     trimspaces pdfcol fontawesome5 upquote; do
            tlmgr install "$pkg" || echo "skip: $pkg"
          done

      # mermaid を画像に落とすのに Chrome を使う。Quarto は Chrome のデバッグポートの
      # 待受を 3 秒しか待たず、間に合わないと「終了しないプロセスの終了」を待って
      # 永久にハングする（ランナー同梱の Chrome で実際に再現した）。起動の軽い
      # chrome-headless-shell を使って余裕を持たせる。
      - name: Install chrome-headless-shell
        run: |
          npx --yes @puppeteer/browsers install chrome-headless-shell@stable \
            --path "$HOME/.cache/puppeteer"
          CHS=$(find "$HOME/.cache/puppeteer" -type f -name chrome-headless-shell | head -1)
          test -n "$CHS"
          "$CHS" --version
          echo "QUARTO_CHROMIUM=$CHS" >> "$GITHUB_ENV"

      - name: Render site
        run: quarto render

      # quarto render は _site/ を作り直すので、PDF は必ずそのあとに置く
      - name: Build PDF
        run: bash scripts/build-pdf.sh

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
